# ─────────────────────────────────────────────────────────────────────────────
# Fly.io configuration — Face API
# Deploy: fly deploy
# First time: fly launch --no-deploy, then fly deploy
# ─────────────────────────────────────────────────────────────────────────────

app            = "face-api"        # Change to your unique app name
primary_region = "lhr"             # lhr=London (matches existing Postgres volume)

[build]
  dockerfile = "Dockerfile"

# ── Non-secret environment variables ─────────────────────────────────────────
# Secrets (DB_URL, REDIS_URL, PASETO_SECRET, PAYSTACK_SECRET_KEY, PAYSTACK_PUBLIC_KEY, PAYSTACK_CALLBACK_URL, ALLOWED_ORIGINS, BOOTSTRAP_SECRET) are set via:
#   fly secrets set KEY=value
[env]
  GIN_MODE    = "release"
  PORT        = "8080"
  MODELS_DIR  = "/app/models"
  APP_ENV     = "prod"

# ── HTTP service ──────────────────────────────────────────────────────────────
[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 50
    soft_limit = 25

# ── Machine size ──────────────────────────────────────────────────────────────
# dlib + pgvector queries are CPU and memory intensive.
# shared-cpu-2x / 4096 MB is the minimum comfortable size.
# Scale up to performance-2x for production traffic.
[[vm]]
  cpu_kind  = "shared"
  cpus      = 2
  memory_mb = 4096

# ── Health check ──────────────────────────────────────────────────────────────
[[http_service.checks]]
  grace_period = "30s"
  interval     = "30s"
  method       = "GET"
  path         = "/health"
  timeout      = "10s"
